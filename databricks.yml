# This is a Databricks asset bundle definition for finapp.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: finapp
  uuid: d1f5b9ee-5d7e-40cf-b1d0-ac732e9455fd

include:
  - resources/jobs/*.yml
  - resources/pipelines/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  mono_webhook_landing_path:
    description: Path for mono api data

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617288273171.11.azuredatabricks.net
    variables:
      catalog: dev
      schema: default
      mono_webhook_landing_path: abfss://dev@ohrycfinapp.dfs.core.windows.net/bronze-landing/mono_webhook
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405617288273171.11.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ohryc@softserveinc.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ohryc@softserveinc.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: fin_app_7405617288273171
      schema: prod
      mono_webhook_landing_path: abfss://dev@ohrycfinapp.dfs.core.windows.net/bronze-landing/mono_webhook
    permissions:
      - user_name: ohryc@softserveinc.com
        level: CAN_MANAGE
