# The main pipeline for finapp

resources:
  pipelines:
    finapp_etl:
      name: finapp_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../../src/finapp_etl"
      configuration:
        mono_webhook_landing_path: ${var.mono_webhook_landing_path}
      clusters:
        - label: default
          num_workers: 2           
          node_type_id: Standard_D4s_v3   
          driver_node_type_id: Standard_D4s_v3
          spark_conf:
            spark.databricks.photon.enabled: "false"

      libraries:
        - glob:
            include: ../../src/finapp_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
