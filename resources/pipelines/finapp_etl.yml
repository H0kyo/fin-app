# The main pipeline for finapp

resources:
  pipelines:
    finapp_etl:
      name: finapp_etl
      catalog: ${var.catalog}
      root_path: "../../src/finapp_etl"
      serverless: true

      libraries:
        - glob:
            include: ../../src/finapp_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
