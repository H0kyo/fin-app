resources:
  jobs:
    sample_job:
      name: create_medallion_and_run_pipeline

      email_notifications:
       on_failure:
         - squ14sss@gmail.com

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../../src/scripts/create_medallion.ipynb
        - task_key: python_wheel_task
          depends_on:
            - task_key: notebook_task
          python_wheel_task:
            package_name: finapp
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
          environment_key: finapp_env
        - task_key: refresh_pipeline
          depends_on:
            - task_key: notebook_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.finapp_etl.id}

      environments:
        - environment_key: finapp_env
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl
